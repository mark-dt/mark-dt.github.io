<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DT Dashboards</title>
    <link rel="icon" type="image/png" href="https://dt-cdn.net/images/favicon-48x48-transparent-48-9b4df9c769.png">
    <link rel="stylesheet" href="css/main.css" />
    <style>
        .page-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 300;
            color: #454646;
            margin-bottom: 24px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6f7071;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 16px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group .label {
            margin-bottom: 4px;
        }

        .form-group .inputfield,
        .form-group select {
            width: 100%;
        }

        .form-group--wide {
            flex: 1 1 300px;
        }

        .form-group--medium {
            flex: 0 1 220px;
        }

        .form-group--full {
            flex: 1 1 100%;
        }

        .form-group select {
            font-family: "BerninaSans", "Open Sans", sans-serif;
            font-size: 14px;
            height: 34px;
            padding: 0 8px;
            border: 1px solid #ccc;
            border-radius: 2px;
            background: #fff;
            color: #454646;
        }

        .dashboard-select {
            font-family: "BerninaSans", "Open Sans", sans-serif;
            font-size: 14px;
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 2px;
            background: #fff;
            color: #454646;
            width: 100%;
            min-height: 300px;
        }

        .dashboard-select option {
            padding: 6px 4px;
        }

        .dashboard-select option:checked {
            background: #e0f4f5;
        }

        .required:before {
            content: "*";
            color: red;
        }

        .hint {
            font-size: 0.8rem;
            color: #898989;
            margin-top: 4px;
        }
    </style>
    <script type="text/javascript" src="js/main.js"></script>
    <script type="text/javascript">

        function getDashboardList() {
            var url = 'https://raw.githubusercontent.com/mark-dt/mark-dt.github.io/dashboards/dashboard-list.json';
            fetch(url, {
                method: "GET",
                mode: 'cors',
            })
                .then(function (response) {
                    return response.json();
                }).then(function (data) {
                    displayDashboardList(data);
                });
        }

        function pushDashboard(data) {
            var tenant = document.getElementById("tenant").value;
            var tmp = tenant.slice(-1);
            if (tmp == '/') {
                tenant = tenant.slice(0, -1);
            }
            var token = document.getElementById("token").value;
            var owner = document.getElementById("dash_owner").value;

            delete data['metadata'];
            delete data['id'];
            data['dashboardMetadata']['owner'] = owner;

            fetch(tenant + '/api/config/v1/dashboards', {
                method: 'post',
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                    "Authorization": "Api-Token " + token
                },
                body: JSON.stringify(data)
            }).then(function (response) {
                return response.json();
            }).then(function (data) {
                console.log(data['id']);
            });
        }

        function getSingleDashboard(name) {
            var url = 'https://raw.githubusercontent.com/mark-dt/Dynatrace-Dashboards/master/' + name + '.json';
            fetch(url, {
                method: "GET",
                mode: 'cors',
            })
                .then(function (response) {
                    return response.json();
                }).then(function (data) {
                    pushDashboard(data);
                });
        }

        function uploadSelected() {
            var sb = document.getElementById('framework');
            var selected = [].filter
                .call(sb.options, function (option) { return option.selected; })
                .map(function (option) { return option.text; });

            for (var i = 0; i < selected.length; i++) {
                getSingleDashboard(selected[i]);
            }
        }

    </script>
</head>

<body>

    <div class="nav has-no-secondary">
        <a class="nav__brand" href="../index.html">
            <img class="nav__logo" src="images/dynatrace-logo.svg" alt="dynatrace logo" />
        </a>
    </div>

    <div class="page-container">

        <h1 class="page-title">Dashboard Marketplace</h1>

        <!-- Connection -->
        <div class="card">
            <div class="card-title">Connection</div>
            <div class="form-row">
                <div class="form-group form-group--wide">
                    <label for="tenant" class="label required">Tenant URL</label>
                    <input type="text" class="inputfield" placeholder="https://xxxxxxxx.live.dynatrace.com/" id="tenant" value="" />
                </div>
                <div class="form-group form-group--wide">
                    <label for="token" class="label required">API Token</label>
                    <input type="password" class="inputfield" placeholder="Write config access needed" id="token" value="" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group form-group--medium">
                    <label for="dash_owner" class="label required">Dashboard Owner</label>
                    <input type="text" class="inputfield" placeholder="your.name@email.com" id="dash_owner" value="" />
                </div>
            </div>
        </div>

        <!-- Dashboard Selection -->
        <div class="card">
            <div class="card-title">Select Dashboards</div>
            <div class="form-row">
                <div class="form-group form-group--full">
                    <label for="framework" class="label">Available Dashboards</label>
                    <select class="dashboard-select" id="framework" multiple>
                    </select>
                    <span class="hint">Hold Ctrl / Cmd to select multiple dashboards.</span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <button type="button" class="btn btn--primary" onclick="uploadSelected()">Upload Dashboards</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        getDashboardList();
    </script>

</body>

</html>
