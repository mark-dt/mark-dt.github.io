<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynatrace Extension Config</title>
    <link rel="icon" type="image/png" href="https://dt-cdn.net/images/favicon-48x48-transparent-48-9b4df9c769.png">
    <link rel="stylesheet" href="css/main.css" />
    <style>
        .page-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 300;
            color: #454646;
            margin-bottom: 24px;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6f7071;
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 16px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group .label {
            margin-bottom: 4px;
        }

        .form-group .inputfield,
        .form-group select,
        .form-group textarea {
            width: 100%;
        }

        .form-group--wide {
            flex: 1 1 300px;
        }

        .form-group--medium {
            flex: 0 1 220px;
        }

        .form-group--full {
            flex: 1 1 100%;
        }

        .form-group select {
            font-family: "BerninaSans", "Open Sans", sans-serif;
            font-size: 14px;
            height: 34px;
            padding: 0 8px;
            border: 1px solid #ccc;
            border-radius: 2px;
            background: #fff;
            color: #454646;
        }

        .form-group textarea {
            font-family: "BerninaSans", "Open Sans", sans-serif;
            font-size: 14px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 2px;
            color: #454646;
            resize: vertical;
            min-height: 80px;
        }

        .separator {
            border: none;
            border-top: 1px solid #eee;
            margin: 16px 0;
        }

        .required:before {
            content: "*";
            color: red;
        }

        #extension-config-fields .label {
            margin-top: 12px;
            margin-bottom: 4px;
        }

        #extension-config-fields textarea {
            font-family: "BerninaSans", "Open Sans", sans-serif;
            font-size: 14px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 2px;
            color: #454646;
            resize: vertical;
            width: 100%;
            min-height: 60px;
        }
    </style>
    <script type="text/javascript">

        async function makeRequest(endpoint, parameters) {
            var tenant = document.getElementById("tenant").value;
            var tmp = tenant.slice(-1);
            if (tmp == '/') {
                tenant = tenant.slice(0, -1);
            }

            var token = document.getElementById("token").value;
            var url = new URL(tenant + endpoint);
            url.search = new URLSearchParams(parameters).toString();

            return fetch(url, {
                method: "GET",
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json',
                    "Authorization": "Api-Token " + token
                },
            }).then(function (response) {
                return response.json();
            });
        }

        function getExtensions() {
            makeRequest("/api/config/v1/extensions", { pageSize: 100 }).then(function (response) {
                updateExtensionDropdown(response);
            });
        }

        function updateExtensionDropdown(data) {
            var drop_down = document.getElementById("event_type");
            drop_down.innerHTML = '<option value="">-- Select an extension --</option>';
            for (var i = 0; i < data.extensions.length; i++) {
                var element = data.extensions[i];
                if (element.type != "ONEAGENT") continue;
                var option = document.createElement("option");
                option.value = element.id;
                option.text = element.id;
                drop_down.add(option);
            }
        }

        function loadExtensionConfig() {
            var event_type = document.getElementById("event_type").value;
            if (!event_type) return;

            makeRequest("/api/config/v1/extensions/" + event_type, { pageSize: 2 }).then(function (response) {
                var node = document.getElementById("extension-config-fields");
                node.innerHTML = "";

                for (var i in response.properties) {
                    var prop = response.properties[i];
                    var label = document.createElement("label");
                    label.className = "label";
                    label.innerHTML = prop.key;

                    var textarea = document.createElement("textarea");
                    textarea.id = prop.key;
                    textarea.innerHTML = prop.defaultValue;

                    node.appendChild(label);
                    node.appendChild(textarea);
                }

                document.getElementById("config-card").style.display = "";
            });
        }

        async function uploadConfig() {
            var payload = {
                "id": document.getElementById("event_type").value,
                "enabled": true,
                "useGlobal": false,
                "hostId": "",
                "properties": {}
            };

            var fields = document.getElementById('extension-config-fields').querySelectorAll('textarea');
            for (var i = 0; i < fields.length; i++) {
                if (fields[i].id) {
                    payload.properties[fields[i].id] = fields[i].value;
                }
            }

            var result = await searchEntities();
            for (var i in result.entities) {
                payload.hostId = result.entities[i].entityId;
                postConfig(payload, { id: document.getElementById("event_type").value });
            }
        }

        function postConfig(payload, parameters) {
            var tenant = document.getElementById("tenant").value;
            var tmp = tenant.slice(-1);
            if (tmp == '/') {
                tenant = tenant.slice(0, -1);
            }

            var token = document.getElementById("token").value;
            var url = new URL(tenant + '/api/config/v1/extensions/' + parameters.id + '/instances/' + payload.hostId);
            url.search = new URLSearchParams(parameters).toString();

            fetch(url, {
                method: "PUT",
                mode: 'cors',
                headers: {
                    'Content-Type': 'application/json; charset=utf-8',
                    "Authorization": "Api-Token " + token
                },
                body: JSON.stringify(payload)
            }).then(function (response) {
                console.log(response);
            });
        }

        async function searchEntities() {
            var selector = document.getElementById('text_entity_selector').value;
            return makeRequest("/api/v2/entities", {
                pageSize: 500,
                entitySelector: selector,
                from: "-3M",
                to: "now"
            });
        }

    </script>
</head>

<body>

    <div class="nav has-no-secondary">
        <a class="nav__brand" href="home.html">
            <img class="nav__logo" src="images/dynatrace-logo.svg" alt="dynatrace logo" />
        </a>
    </div>

    <div class="page-container">

        <h1 class="page-title">Extension Configurator</h1>

        <!-- Connection -->
        <div class="card">
            <div class="card-title">Connection</div>
            <div class="form-row">
                <div class="form-group form-group--wide">
                    <label for="tenant" class="label required">Tenant URL</label>
                    <input type="text" class="inputfield" placeholder="https://xxxxxxxx.live.dynatrace.com/" id="tenant" value="" />
                </div>
                <div class="form-group form-group--wide">
                    <label for="token" class="label required">API Token</label>
                    <input type="password" class="inputfield" placeholder="Extension config access needed" id="token" value="" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <button type="button" class="btn btn--primary" onclick="getExtensions()">Fetch Extensions</button>
                </div>
            </div>
        </div>

        <!-- Extension Selection -->
        <div class="card">
            <div class="card-title">Extension Selection</div>
            <div class="form-row">
                <div class="form-group form-group--wide">
                    <label for="event_type" class="label">Extension List</label>
                    <select id="event_type">
                        <option value="">-- Fetch extensions first --</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="button" class="btn btn--primary" onclick="loadExtensionConfig()">Load Config</button>
                </div>
            </div>
        </div>

        <!-- Entity Selector -->
        <div class="card">
            <div class="card-title">Entity Selector</div>
            <div class="form-row">
                <div class="form-group form-group--full">
                    <label for="text_entity_selector" class="label">Selector</label>
                    <textarea id="text_entity_selector" placeholder='type("host"),tag("env")'>type("host"),tag("env")</textarea>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <button type="button" class="btn btn--primary" onclick="searchEntities()">Search Entities</button>
                </div>
            </div>
        </div>

        <!-- Extension Config (shown after loading) -->
        <div class="card" id="config-card" style="display: none;">
            <div class="card-title">Configure Extension</div>
            <div id="extension-config-fields"></div>
            <div class="form-row" style="margin-top: 16px;">
                <div class="form-group">
                    <button type="button" class="btn btn--primary" onclick="uploadConfig()">Upload Config</button>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
